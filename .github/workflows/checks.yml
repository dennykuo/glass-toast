name: Checks

on:
  workflow_call:
    inputs:
      upload-pages:
        description: Upload the validated docs build for GitHub Pages
        type: boolean
        default: false
    outputs:
      pages-ready:
        description: A Pages artifact was uploaded for the published package version
        value: ${{ jobs.check.outputs.pages-ready }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      pages-ready: ${{ steps.release.outputs.ready }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser # 包含套件 build 與型別產生
      - run: npm run check:package
      - run: npm run build:docs

      - name: Check that the docs version is published to npm
        id: release
        if: inputs.upload-pages
        shell: bash
        run: |
          package="$(node -p 'const p = require("./package.json"); p.name + "@" + p.version')"
          if ! result="$(npm view "$package" version --json --registry=https://registry.npmjs.org)"; then
            if jq -e '.error.code == "E404"' <<< "$result" > /dev/null; then
              echo "::notice::$package is unpublished. Publish it and run CI on main to deploy its docs."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit 1
          fi
          jq -e --arg version "${package##*@}" '. == $version or (type == "array" and . == [$version])' <<< "$result" > /dev/null
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        if: steps.release.outputs.ready == 'true'
        with:
          path: dist-docs
