name: Docs

# 文件站部署到 GitHub Pages。repo 設定需先開啟 Pages，Source 選「GitHub Actions」。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同時只跑一次部署；新的 push 不取消進行中的部署，避免站台停在一半
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    # 手動執行也只能發佈 main，避免將 develop 的測試版本送到正式文件站。
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/checks.yml
    with:
      upload-pages: true

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
